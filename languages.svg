<svg xmlns="http://www.w3.org/2000/svg" width="460" height="234" viewBox="0 0 460 234">
  <style>
    :root {
      --bg: #ffffff;
      --border: #d0d7de;
      --track: #ebedf0;
      --title: #1f2328;
      --sub: #656d76;
      --pct: #57606a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --border: #30363d;
        --track: #21262d;
        --title: #f0f6fc;
        --sub: #8b949e;
        --pct: #7d8590;
      }
    }
    .bg { fill: var(--bg); stroke: var(--border); stroke-width: 1px; rx: 4px; }
    .title { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--title); }
    .sub { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--sub); }
    .lang-name { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--title); }
    .lang-pct { font: 400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--pct); text-anchor: end; }
  </style>

  <!-- Card Background -->
  <rect width="460" height="234" class="bg"/>

  <!-- Card Header -->
  <text x="30" y="32" class="title">Most Used Languages</text>
  <text x="30" y="48" class="sub">Across all 65 repositories</text>

  <!-- Progress Bar (Fixed Clip Path) -->
  <defs>
    <clipPath id="bar-clip">
      <rect x="0" y="0" width="400" height="10" rx="5" ry="5"/>
    </clipPath>
  </defs>

  <!-- Background Track + Colored Segments -->
  <g transform="translate(30, 66)">
    <rect width="400" height="10" rx="5" fill="var(--track)"/>
    <g clip-path="url(#bar-clip)">
      <rect x="0.00" y="0" width="221.73" height="10" fill="#3178c6"/><rect x="221.73" y="0" width="75.60" height="10" fill="#f1e05a"/><rect x="297.34" y="0" width="50.55" height="10" fill="#b07219"/><rect x="347.88" y="0" width="21.72" height="10" fill="#A97BFF"/><rect x="369.60" y="0" width="12.74" height="10" fill="#178600"/><rect x="382.34" y="0" width="10.59" height="10" fill="#4F5D95"/><rect x="392.93" y="0" width="7.07" height="10" fill="#6e7681"/>
    </g>
  </g>

  <!-- Language Grid -->
  <circle cx="35" cy="100" r="5" fill="#3178c6"/><text x="48" y="104" class="lang-name">TypeScript</text><text x="205" y="104" class="lang-pct">55.4%</text><circle cx="245" cy="100" r="5" fill="#f1e05a"/><text x="258" y="104" class="lang-name">JavaScript</text><text x="415" y="104" class="lang-pct">18.9%</text><circle cx="35" cy="128" r="5" fill="#b07219"/><text x="48" y="132" class="lang-name">Java</text><text x="205" y="132" class="lang-pct">12.6%</text><circle cx="245" cy="128" r="5" fill="#A97BFF"/><text x="258" y="132" class="lang-name">Kotlin</text><text x="415" y="132" class="lang-pct">5.4%</text><circle cx="35" cy="156" r="5" fill="#178600"/><text x="48" y="160" class="lang-name">C#</text><text x="205" y="160" class="lang-pct">3.2%</text><circle cx="245" cy="156" r="5" fill="#4F5D95"/><text x="258" y="160" class="lang-name">PHP</text><text x="415" y="160" class="lang-pct">2.6%</text><circle cx="35" cy="184" r="5" fill="#6e7681"/><text x="48" y="188" class="lang-name">Other</text><text x="205" y="188" class="lang-pct">1.8%</text>
</svg>
