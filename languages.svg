<svg xmlns="http://www.w3.org/2000/svg" width="420" height="198" viewBox="0 0 420 198">
  <style>
    :root {
      --bg: #ffffff;
      --border: #d0d7de;
      --track: #ebedf0;
      --title: #1f2328;
      --sub: #656d76;
      --pct: #656d76;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --border: #30363d;
        --track: #21262d;
        --title: #f0f6fc;
        --sub: #8b949e;
        --pct: #8b949e;
      }
    }
    .bg { fill: var(--bg); stroke: var(--border); stroke-width: 1px; rx: 6px; }
    .title { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--title); }
    .sub { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--sub); }
    .lang-name { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--title); }
    .lang-pct { font: 400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--pct); text-anchor: end; }
  </style>

  <!-- Card Background -->
  <rect width="420" height="198" class="bg"/>

  <!-- Card Header -->
  <text x="24" y="26" class="title">Most Used Languages</text>
  <text x="24" y="40" class="sub">Across all 65 repositories</text>

  <!-- Progress Bar -->
  <defs>
    <clipPath id="bar-clip">
      <rect x="0" y="0" width="372" height="8" rx="4" ry="4"/>
    </clipPath>
  </defs>

  <!-- Bar Track + Segments -->
  <g transform="translate(24, 54)">
    <rect width="372" height="8" rx="4" fill="var(--track)"/>
    <g clip-path="url(#bar-clip)">
      <rect x="0.00" y="0" width="206.20" height="8" fill="#3178c6"/><rect x="206.20" y="0" width="70.31" height="8" fill="#f1e05a"/><rect x="276.51" y="0" width="47.01" height="8" fill="#b07219"/><rect x="323.52" y="0" width="20.19" height="8" fill="#A97BFF"/><rect x="343.71" y="0" width="11.84" height="8" fill="#178600"/><rect x="355.55" y="0" width="9.85" height="8" fill="#4F5D95"/><rect x="365.41" y="0" width="1.39" height="8" fill="#89e051"/><rect x="366.80" y="0" width="1.37" height="8" fill="#8b949e"/><rect x="368.17" y="0" width="3.83" height="8" fill="#6e7681"/>
    </g>
  </g>

  <!-- Language Grid -->
  <circle cx="28" cy="78" r="4" fill="#3178c6"/><text x="40" y="82" class="lang-name">TypeScript</text><text x="196" y="82" class="lang-pct">55.4%</text><circle cx="222" cy="78" r="4" fill="#f1e05a"/><text x="234" y="82" class="lang-name">JavaScript</text><text x="390" y="82" class="lang-pct">18.9%</text><circle cx="28" cy="100" r="4" fill="#b07219"/><text x="40" y="104" class="lang-name">Java</text><text x="196" y="104" class="lang-pct">12.6%</text><circle cx="222" cy="100" r="4" fill="#A97BFF"/><text x="234" y="104" class="lang-name">Kotlin</text><text x="390" y="104" class="lang-pct">5.4%</text><circle cx="28" cy="122" r="4" fill="#178600"/><text x="40" y="126" class="lang-name">C#</text><text x="196" y="126" class="lang-pct">3.2%</text><circle cx="222" cy="122" r="4" fill="#4F5D95"/><text x="234" y="126" class="lang-name">PHP</text><text x="390" y="126" class="lang-pct">2.6%</text><circle cx="28" cy="144" r="4" fill="#89e051"/><text x="40" y="148" class="lang-name">Shell</text><text x="196" y="148" class="lang-pct">0.4%</text><circle cx="222" cy="144" r="4" fill="#8b949e"/><text x="234" y="148" class="lang-name">Objective-C</text><text x="390" y="148" class="lang-pct">0.4%</text><circle cx="28" cy="166" r="4" fill="#6e7681"/><text x="40" y="170" class="lang-name">Other</text><text x="196" y="170" class="lang-pct">1.0%</text>
</svg>
