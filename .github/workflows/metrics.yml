name: Languages
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/languages.py
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: vclong2003
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git diff --cached --quiet || (git commit -m "Update languages" && git push)
